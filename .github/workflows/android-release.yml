name: Android CI/CD — Build, Auto-Tag & Release Signed APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (auto, patch, minor, major)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore or generate debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            if ! tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore; then
              rm -f debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

  release:
    name: Auto-Tag, Sign & Publish GitHub Release
    needs: verify
    if: |
      github.event_name != 'pull_request' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compute next semantic version tag
        id: version
        env:
          MANUAL_BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          git fetch --tags --force
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            VERSION_CORE="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CORE"
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s%n%b")

            BUMP="$MANUAL_BUMP"
            if [ "$BUMP" = "auto" ]; then
              if echo "$COMMITS" | grep -qE 'BREAKING CHANGE|^[a-zA-Z]+(\([^)]+\))?!:'; then
                BUMP="major"
              elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
                BUMP="minor"
              else
                BUMP="patch"
              fi
            fi

            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Ensure tag is unique even on manual re-runs
          while git rev-parse -q --verify "refs/tags/$NEXT_TAG" >/dev/null 2>&1; do
            VERSION_CORE="${NEXT_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CORE"
            PATCH=$((PATCH + 1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          done

          VERSION_NAME="${NEXT_TAG#v}"
          VERSION_CODE="${{ github.run_number }}"

          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Computed release version: $NEXT_TAG (versionCode=$VERSION_CODE)"

      - name: Prepare signing keystore & build signed APK
        id: build_apk
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p dist

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Building production-signed Release APK..."
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "${RUNNER_TEMP}/my-upload-key.jks"
            export KEYSTORE_PATH="${RUNNER_TEMP}/my-upload-key.jks"

            gradle :app:assembleRelease --no-daemon \
              -PversionCode="${{ steps.version.outputs.version_code }}" \
              -PversionName="${{ steps.version.outputs.version_name }}"

            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            OUT_APK="dist/AanoorParent-${{ steps.version.outputs.next_tag }}.apk"
            SIGN_MODE="production-release"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD secrets are not set. Falling back to debug.keystore signing so the APK is still installable."
            if [ -f debug.keystore.base64 ]; then
              if ! tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore; then
                rm -f debug.keystore
              fi
            fi
            if [ ! -s debug.keystore ]; then
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi

            gradle :app:assembleDebug --no-daemon \
              -PversionCode="${{ steps.version.outputs.version_code }}" \
              -PversionName="${{ steps.version.outputs.version_name }}"

            RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            OUT_APK="dist/AanoorParent-${{ steps.version.outputs.next_tag }}-debug.apk"
            SIGN_MODE="debug-keystore-fallback"
          fi

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "APK output not found!"
            exit 1
          fi

          cp "$RAW_APK" "$OUT_APK"

          # Verify APK signature with apksigner from Android SDK build-tools
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$OUT_APK"
          fi

          (cd dist && sha256sum "$(basename "$OUT_APK")" > SHA256SUMS.txt)

          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$OUT_APK")" >> "$GITHUB_OUTPUT"
          echo "sign_mode=$SIGN_MODE" >> "$GITHUB_OUTPUT"

      - name: Clean up decoded keystores
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/my-upload-key.jks" debug.keystore

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.next_tag }}" -m "Release ${{ steps.version.outputs.next_tag }}"
          git push origin "${{ steps.version.outputs.next_tag }}"

      - name: Publish GitHub Release with signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          name: "Aanoor Parent ${{ steps.version.outputs.next_tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Aanoor Parent (${{ steps.version.outputs.next_tag }})

            - **Version Code:** `${{ steps.version.outputs.version_code }}`
            - **Signing Mode:** `${{ steps.build_apk.outputs.sign_mode }}`

            ### Install on Android
            1. Download **`${{ steps.build_apk.outputs.apk_name }}`** from **Assets** below.
            2. Tap the downloaded `.apk` file on your Android phone to install.
          files: |
            ${{ steps.build_apk.outputs.apk_path }}
            dist/SHA256SUMS.txt
